# Argus 配置文件
# 只包含需要自定义的配置项，其他将使用默认值

app:
  port: "9483"
  mode: "release"
  # 开发阶段标识 - 设置为 false 或删除此行启用生产模式
  development: true

# 如果需要指定工具路径，取消注释并设置路径
# tools:
#   exiftool_path: "C:/tools/exiftool/exiftool.exe"
#   imagemagick_path: "C:/tools/imagemagick/magick.exe"
#   libvips_path: "C:/tools/vips/bin/vips.exe"

logging:
  level: "debug"

database:
  type: "sqlite"

# 图像处理配置
image:
  thumbnail_format: "jpg"
  thumbnail_size: [512, 720]
  default_thumbnail_size: 720  # 默认使用的缩略图尺寸
  thumbnail_quality: 80
  screen_size: 1080