<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Argus - 文件夹预览（双栏 + 面包屑 + 可拖动分割）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:'#3B82F6'}}}}</script>
  <style>
    :root { --tile: 220px }
    .tile { width: var(--tile) }
    .tile-h { width: var(--tile); height: calc(var(--tile) * .75) }
    .pane-active { outline: 2px solid rgba(59,130,246,.6); outline-offset: -2px }
    .splitter { background: transparent; position: relative; }
    .splitter:hover::after { content:''; position:absolute; inset:0; background: rgba(59,130,246,.2) }
    .splitter-vert { width: 6px; cursor: col-resize }
    .splitter-horz { height: 6px; cursor: row-resize }
    .no-select { user-select: none }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 no-select">
  <!-- 顶部：命令栏（第1行） -->
  <div class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200">
    <div class="mx-auto max-w-[1400px] px-3 py-2 flex items-center gap-2">
      <!-- 快捷命令（左侧） -->
      <div class="flex items-center gap-1">
        <button id="cmdCut" class="px-2 py-1 rounded hover:bg-slate-100" title="剪切"><ion-icon name="cut-outline"></ion-icon></button>
        <button id="cmdCopy" class="px-2 py-1 rounded hover:bg-slate-100" title="复制"><ion-icon name="copy-outline"></ion-icon></button>
        <button id="cmdPaste" class="px-2 py-1 rounded hover:bg-slate-100" title="粘贴"><ion-icon name="clipboard-outline"></ion-icon></button>
        <button id="cmdRename" class="px-2 py-1 rounded hover:bg-slate-100" title="重命名"><ion-icon name="create-outline"></ion-icon></button>
        <button id="cmdDel" class="px-2 py-1 rounded hover:bg-slate-100 text-red-600" title="删除"><ion-icon name="trash-outline"></ion-icon></button>
        <div class="w-px h-5 bg-slate-200 mx-1"></div>
        <button id="cmdAlbum" class="px-2 py-1 rounded hover:bg-slate-100" title="加入相册"><ion-icon name="albums-outline"></ion-icon></button>
        <button id="cmdTags" class="px-2 py-1 rounded hover:bg-slate-100" title="编辑标签"><ion-icon name="pricetag-outline"></ion-icon></button>
      </div>
      <!-- 中部：视图/大小/布局/预览开关 -->
      <div class="flex items-center gap-2 mx-auto">
        <div class="flex items-center gap-1 bg-slate-100 rounded-full px-1 py-0.5">
          <button id="viewTiles" class="px-3 py-1 rounded-full text-sm bg-white shadow">平铺</button>
          <button id="viewList" class="px-3 py-1 rounded-full text-sm">列表</button>
        </div>
        <div class="flex items-center gap-1 bg-slate-100 rounded-full px-1 py-0.5" title="缩略图大小">
          <button class="sizeBtn px-2 py-1 rounded-full text-sm" data-size="160">小</button>
          <button class="sizeBtn px-2 py-1 rounded-full text-sm bg-white shadow" data-size="220">中</button>
          <button class="sizeBtn px-2 py-1 rounded-full text-sm" data-size="280">大</button>
          <button class="sizeBtn px-2 py-1 rounded-full text-sm" data-size="340">超大</button>
        </div>
        <div class="flex items-center gap-1 bg-slate-100 rounded-full px-1 py-0.5" title="布局">
          <button id="btnSingle" class="px-3 py-1 rounded-full text-sm bg-white shadow">单栏</button>
          <button id="btnH" class="px-3 py-1 rounded-full text-sm">左右</button>
          <button id="btnV" class="px-3 py-1 rounded-full text-sm">上下</button>
        </div>
        <label class="inline-flex items-center gap-1 text-sm text-slate-700"><input id="togglePreview" type="checkbox">预览窗格</label>
      </div>
      <!-- 右侧：搜索/主题 -->
      <div class="flex items-center gap-2">
        <div class="relative">
          <ion-icon name="search-outline" class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400"></ion-icon>
          <input id="search" placeholder="搜索（活动面板）" class="pl-8 pr-2 py-1 border rounded text-sm border-slate-200 focus:border-brand focus:outline-none w-64"/>
        </div>
        <button id="btnTheme" class="p-2 rounded hover:bg-slate-100" title="主题"><ion-icon name="moon-outline"></ion-icon></button>
      </div>
    </div>
    <!-- 第二行：面包屑（活动面板） -->
    <div class="mx-auto max-w-[1400px] px-3 pb-2 flex items-center gap-2 text-sm text-slate-600">
      <button id="navBack" class="p-1.5 rounded hover:bg-slate-100" title="后退"><ion-icon name="chevron-back-outline"></ion-icon></button>
      <button id="navForward" class="p-1.5 rounded hover:bg-slate-100" title="前进"><ion-icon name="chevron-forward-outline"></ion-icon></button>
      <button id="navUp" class="p-1.5 rounded hover:bg-slate-100" title="上一级"><ion-icon name="arrow-up-outline"></ion-icon></button>
      <div id="breadcrumb" class="flex items-center gap-1 overflow-hidden"></div>
      <div class="ml-auto text-slate-500" id="stats">—</div>
    </div>
  </div>

  <!-- 工作区：单栏/双栏（左右/上下） + 预览窗格可选 -->
  <main class="mx-auto max-w-[1400px] px-3 py-3">
    <div id="work" class="grid gap-2" style="grid-template-columns: 1fr; height: calc(100vh - 112px);"></div>
  </main>

  <!-- 大图预览 -->
  <div id="previewModal" class="fixed inset-0 bg-black/70 items-center justify-center hidden">
    <div class="absolute inset-0" id="previewBg"></div>
    <div class="relative max-w-[90vw] max-h-[90vh]">
      <img id="pvImg" class="max-w-[90vw] max-h-[90vh] object-contain hidden"/>
      <video id="pvVideo" class="max-w-[90vw] max-h-[90vh] hidden" controls></video>
      <button id="pvClose" class="absolute top-2 right-2 p-2 rounded-full bg-white"><ion-icon name="close-outline"></ion-icon></button>
    </div>
  </div>

  <script>
  // 数据（演示）
  const img=(s,w=1000,h=750)=>`https://picsum.photos/seed/${encodeURIComponent(s)}/${w}/${h}`
  let gid=1; const uid=()=> (gid++).toString()
  const f=(name,ch=[])=>({id:uid(),type:'folder',name,children:ch})
  const im=name=>({id:uid(),type:'image',name,src:img(name),poster:img(name,400,300),w:1000,h:750,date:new Date()})
  const vi=name=>({id:uid(),type:'video',name,poster:img(name,960,540),date:new Date()})
  const ot=(name,ext,color)=>({id:uid(),type:'other',name,ext,color,date:new Date()})
  const root=f('首页',[f('旅拍',[f('东京',[im('tokyo-1'),im('tokyo-2'),vi('tokyo-v')]),f('北海道',[im('hok-1'),im('hok-2')]),im('street-1')]),f('RAW',[ot('readme','txt','#64748B'),im('raw-1')]),im('cover-1'),vi('reel-1'),ot('安装包','exe','#94A3B8')])

  // Pane 状态
  const mk=()=>({current:root,history:[root],hi:0,selection:new Set(),view:'tiles',keyword:''})
  const panes=[mk(),mk()]
  let active=0, layoutMode='single', previewOn=false, tileSize=220

  const qs=s=>document.querySelector(s)
  function setTile(v){ tileSize=v; document.documentElement.style.setProperty('--tile', v+'px') }

  // FS 工具
  function visit(n,fn){ fn(n); if(n.children) n.children.forEach(c=>visit(c,fn)) }
  function findById(id){ let r=null; visit(root,x=>{ if(x.id===id) r=x }); return r }
  function items(p){ let a=(p.current.children||[]); if(p.keyword) a=a.filter(i=>i.name.toLowerCase().includes(p.keyword)); return a }

  // 面包屑（活动面板）
  function pathTo(node){ const path=[]; let ok=false; (function dfs(n){ path.push(n); if(n===node){ ok=true; return } if(n.children) for(const c of n.children){ if(dfs(c)) return } path.pop() })(root); return ok? path:[root] }
  function renderCrumb(){ const p=panes[active], bc=qs('#breadcrumb'); bc.innerHTML=''; const path=pathTo(p.current); path.forEach((n,i,arr)=>{ const b=document.createElement('button'); b.className='px-2 py-1 rounded hover:bg-slate-100 truncate max-w-[240px]'; b.textContent=n.name; b.title=n.name; b.onclick=()=>{ if(i===arr.length-1) return; p.current=n; p.history=[root,n]; p.hi=1; p.selection.clear(); renderAll() }; bc.appendChild(b); if(i<arr.length-1){ const s=document.createElement('span'); s.textContent='/'; s.className='text-slate-400'; bc.appendChild(s) } }) }

  // 视图：平铺
  function tile(p, item, idx){ const sel=p.selection.has(item.id); const c=document.createElement('div'); c.className='tile border rounded-lg bg-white hover:shadow transition overflow-hidden '+(sel?'ring-2 ring-brand border-brand':'border-slate-200'); c.dataset.id=item.id; c.dataset.idx=idx; c.dataset.type=item.type; const box=document.createElement('div'); box.className='tile-h bg-slate-100 relative'; c.appendChild(box); if(item.type==='folder'){ const cover=(item.children||[]).find(x=>x.type==='image'||x.type==='video'); if(cover){ const i=document.createElement('img'); i.src=cover.poster||cover.src; i.className='w-full h-full object-cover'; box.appendChild(i) } const b=document.createElement('div'); b.className='absolute left-2 top-2 px-2 py-0.5 text-xs rounded bg-black/40 text-white'; b.textContent='文件夹'; box.appendChild(b) } else if(item.type==='image'){ const i=document.createElement('img'); i.src=item.poster||item.src; i.className='w-full h-full object-cover'; box.appendChild(i); const m=document.createElement('div'); m.className='absolute left-2 top-2 px-2 py-0.5 text-xs rounded bg-black/40 text-white'; m.textContent=`${item.w}×${item.h}`; box.appendChild(m) } else if(item.type==='video'){ const i=document.createElement('img'); i.src=item.poster; i.className='w-full h-full object-cover'; box.appendChild(i); const pbtn=document.createElement('div'); pbtn.className='absolute inset-0 flex items-center justify-center'; pbtn.innerHTML='<div class="w-10 h-10 rounded-full bg-black/50 flex items-center justify-center text-white"><ion-icon name="play-outline"></ion-icon></div>'; box.appendChild(pbtn) } else { box.style.background=item.color||'#CBD5E1' } const row=document.createElement('div'); row.className='px-2 py-1 text-sm flex items-center gap-2'; row.innerHTML=`<ion-icon name="${item.type==='folder'?'folder-outline':item.type==='image'?'image-outline':item.type==='video'?'videocam-outline':'document-outline'}" class="text-slate-500"></ion-icon><span class="truncate" title="${item.name}">${item.name}</span>`; c.appendChild(row); return c }
  // 视图：列表
  function listRow(p,item,idx){ const sel=p.selection.has(item.id); const r=document.createElement('div'); r.className='grid grid-cols-12 items-center px-3 py-2 border-b '+(sel?'bg-blue-50 border-brand/40':'hover:bg-slate-50'); r.dataset.id=item.id; r.dataset.idx=idx; r.dataset.type=item.type; const n=document.createElement('div'); n.className='col-span-6 flex items-center gap-2'; n.innerHTML=`<ion-icon name="${item.type==='folder'?'folder-outline':item.type==='image'?'image-outline':item.type==='video'?'videocam-outline':'document-outline'}" class="text-slate-500"></ion-icon><span class="truncate" title="${item.name}">${item.name}</span>`; const t=document.createElement('div'); t.className='col-span-2 text-slate-500 text-sm'; t.textContent=item.type; const s=document.createElement('div'); s.className='col-span-2 text-slate-500 text-sm'; s.textContent=item.type==='image'? `${item.w}×${item.h}`:'--'; const d=document.createElement('div'); d.className='col-span-2 text-slate-500 text-sm text-right'; d.textContent=(item.date||new Date()).toLocaleDateString(); r.append(n,t,s,d); return r }
  function renderPane(p, mount){ const wrap=document.createElement('div'); wrap.className='border border-slate-200 rounded-xl bg-white overflow-hidden'; wrap.onclick=()=>{ active=(mount.id==='paneB')?1:0; renderAll() }; if(p.view==='tiles'){ const cont=document.createElement('div'); cont.className='p-3 grid gap-3'; cont.style.gridTemplateColumns='repeat(auto-fill, minmax(var(--tile), 1fr))'; items(p).forEach((it,i)=> cont.appendChild(tile(p,it,i))); wrap.appendChild(cont); mount.replaceChildren(wrap); cont.addEventListener('click', e=>onClick(e,p)); cont.addEventListener('dblclick', e=>onDbl(e,p)) } else { const head=document.createElement('div'); head.className='grid grid-cols-12 px-3 py-2 text-xs text-slate-500 border-b bg-slate-50'; head.innerHTML='<div class="col-span-6">名称</div><div class="col-span-2">类型</div><div class="col-span-2">尺寸/大小</div><div class="col-span-2 text-right">日期</div>'; const cont=document.createElement('div'); cont.className='divide-y'; items(p).forEach((it,i)=> cont.appendChild(listRow(p,it,i))); wrap.append(head,cont); mount.replaceChildren(wrap); cont.addEventListener('click', e=>onClick(e,p)); cont.addEventListener('dblclick', e=>onDbl(e,p)) } if((mount.id==='paneA'&&active===0)||(mount.id==='paneB'&&active===1)) wrap.classList.add('pane-active') }

  // 点击/双击
  function onClick(e,p){ const el=e.target.closest('[data-id]'); if(!el) return; const id=el.dataset.id; const idx=parseInt(el.dataset.idx); const it=items(p)[idx]; if(e.ctrlKey||e.metaKey){ p.selection.has(id)? p.selection.delete(id): p.selection.add(id) } else { p.selection.clear(); p.selection.add(id) } renderAll() }
  function onDbl(e,p){ const el=e.target.closest('[data-id]'); if(!el) return; const it=findById(el.dataset.id); if(!it) return; if(it.type==='folder') enter(p,it); else openPreview(it) }

  // 导航
  function enter(p,node){ p.current=node; p.history=p.history.slice(0,p.hi+1); p.history.push(p.current); p.hi++; p.selection.clear(); renderAll() }
  function back(){ const p=panes[active]; if(p.hi>0){ p.hi--; p.current=p.history[p.hi]; p.selection.clear(); renderAll() } }
  function forward(){ const p=panes[active]; if(p.hi<p.history.length-1){ p.hi++; p.current=p.history[p.hi]; p.selection.clear(); renderAll() } }
  function up(){ const p=panes[active]; if(p.current!==root){ p.current=root; p.history=[root]; p.hi=0; p.selection.clear(); renderAll() } }
  function navTo(i,node){ const p=panes[i]; p.current=node; p.history=[root,node]; p.hi=1; p.selection.clear(); renderAll() }

  // 预览窗格与大预览
  function selectedOne(){ const p=panes[active]; const id=[...p.selection][0]; return id? findById(id):null }
  function renderPreviewPane(mount){ const it=selectedOne(); const box=document.createElement('div'); box.className='border border-slate-200 rounded-xl bg-white p-3'; if(!it){ box.innerHTML='<div class="text-slate-500 text-sm">未选择项目</div>' } else { box.innerHTML = it.type==='image'? `<img src="${it.poster||it.src}" class="w-full rounded mb-3"/><div class="text-sm">${it.name}</div><div class="text-xs text-slate-500">${it.w}×${it.h}</div>` : it.type==='video'? `<img src="${it.poster}" class="w-full rounded mb-3"/><div class="text-sm">${it.name}</div><div class="text-xs text-slate-500">视频</div>` : it.type==='folder'? `<div class="text-sm">文件夹 · ${it.name}</div>` : `<div class='w-full h-40 rounded' style='background:${it.color||'#CBD5E1'}'></div><div class='text-sm mt-2'>${it.name}</div>` } mount.replaceChildren(box) }
  function openPreview(it){ const m=qs('#previewModal'),i=qs('#pvImg'),v=qs('#pvVideo'); if(it.type==='image'){ v.pause(); v.classList.add('hidden'); i.src=it.src; i.classList.remove('hidden') } else if(it.type==='video'){ i.classList.add('hidden'); v.poster=it.poster; v.classList.remove('hidden') } m.classList.remove('hidden'); m.classList.add('flex') }
  function closePreview(){ const m=qs('#previewModal'),v=qs('#pvVideo'); v.pause(); m.classList.add('hidden'); m.classList.remove('flex') }

  // 分割条拖动
  let dragState=null
  function initHResize(container){ const splitter=container.querySelector('.splitter-vert'); if(!splitter) return; splitter.onmousedown=(e)=>{ e.preventDefault(); const rect=container.getBoundingClientRect(); const total=rect.width; dragState={type:'h', startX:e.clientX, total, container, left:container._left || total/2 } ; document.addEventListener('mousemove', onDrag); document.addEventListener('mouseup', stopDrag, {once:true}) } }
  function initVResize(container){ const splitter=container.querySelector('.splitter-horz'); if(!splitter) return; splitter.onmousedown=(e)=>{ e.preventDefault(); const rect=container.getBoundingClientRect(); const total=rect.height; dragState={type:'v', startY:e.clientY, total, container, top:container._top || total/2 } ; document.addEventListener('mousemove', onDrag); document.addEventListener('mouseup', stopDrag, {once:true}) } }
  function onDrag(e){ if(!dragState) return; if(dragState.type==='h'){ const dx=e.clientX - dragState.startX; let left=dragState.left + dx; const min=240, max=dragState.total - 240; left=Math.max(min, Math.min(max, left)); const right=dragState.total - left - 6; dragState.container.style.gridTemplateColumns = dragState.container._withPreview? `${left}px 6px ${Math.max(240,right-340-6)}px 6px 340px` : `${left}px 6px ${right}px`; dragState.container._left = left } else { const dy=e.clientY - dragState.startY; let top=dragState.top + dy; const min=180, max=dragState.total - 180; top=Math.max(min, Math.min(max, top)); const bottom=dragState.total - top - 6; dragState.container.style.gridTemplateRows = `${top}px 6px ${bottom}px`; dragState.container._top = top } }
  function stopDrag(){ document.removeEventListener('mousemove', onDrag); dragState=null }

  // 统计
  function statsText(p){ const l=items(p); const s={all:l.length,folder:0,image:0,video:0,other:0}; l.forEach(i=>s[i.type]++); return `共 ${s.all} 项 · 文件夹 ${s.folder} · 照片 ${s.image} · 视频 ${s.video}` }

  // 渲染布局
  function renderAll(){
    // 顶部状态
    qs('#stats').textContent = statsText(panes[active])
    renderCrumb()

    const work=qs('#work'); work.innerHTML=''
    // 计算列 / 行
    if(layoutMode==='single'){
      work.style.gridTemplateRows = '1fr'
      work.style.gridTemplateColumns = previewOn? '1fr 340px' : '1fr'
      const a=document.createElement('div'); a.id='paneA'; renderPane(panes[0], a); work.appendChild(a)
      if(previewOn){ const pv=document.createElement('aside'); renderPreviewPane(pv); work.appendChild(pv) }
    } else if(layoutMode==='h'){
      if(previewOn){ work.style.gridTemplateColumns = '1fr 6px 1fr 6px 340px'; work._withPreview=true } else { work.style.gridTemplateColumns = '1fr 6px 1fr'; work._withPreview=false }
      work.style.gridTemplateRows = '1fr'
      const a=document.createElement('div'); a.id='paneA'; const b=document.createElement('div'); b.id='paneB'; const split=document.createElement('div'); split.className='splitter splitter-vert rounded'; renderPane(panes[0], a); renderPane(panes[1], b); work.append(a, split, b); if(previewOn){ const s2=document.createElement('div'); s2.style.width='6px'; work.appendChild(s2); const pv=document.createElement('aside'); renderPreviewPane(pv); work.appendChild(pv) } initHResize(work)
    } else { // two-v
      work.style.gridTemplateColumns = previewOn? '1fr 340px' : '1fr'
      work.style.gridTemplateRows = '1fr 6px 1fr'
      const col=document.createElement('div'); col.className='grid gap-2'; col.style.gridTemplateRows='1fr 6px 1fr'
      const a=document.createElement('div'); a.id='paneA'; const b=document.createElement('div'); b.id='paneB'; const split=document.createElement('div'); split.className='splitter splitter-horz rounded'; renderPane(panes[0], a); renderPane(panes[1], b); col.append(a, split, b); if(previewOn){ const pv=document.createElement('aside'); renderPreviewPane(pv); work.append(col, pv) } else { work.append(col) } initVResize(col)
    }

    // 导航按钮状态
    const p=panes[active]; qs('#navBack').disabled=p.hi===0; qs('#navForward').disabled=p.hi>=p.history.length-1; qs('#navUp').disabled=p.current===root
  }

  // 命令栏（活动面板）
  let clip=null
  function sel(){ return [...panes[active].selection].map(id=>findById(id)).filter(Boolean) }
  qs('#cmdCut').onclick = ()=>{ const a=sel(); if(!a.length) return alert('请选择'); clip={op:'cut', ids:a.map(x=>x.id)} }
  qs('#cmdCopy').onclick = ()=>{ const a=sel(); if(!a.length) return alert('请选择'); clip={op:'copy', ids:a.map(x=>x.id)} }
  qs('#cmdPaste').onclick = ()=>{ if(!clip) return; const p=panes[active]; if(clip.op==='cut'){ clip.ids.forEach(id=>{ const n=findById(id); if(n){ removeNode(id); (p.current.children ||= []).push(n) } }); clip=null } else { clip.ids.forEach(id=>{ const n=findById(id); if(n){ (p.current.children ||= []).push(cloneNode(n)) } }) } renderAll() }
  qs('#cmdRename').onclick = ()=>{ const p=panes[active]; const id=[...p.selection][0]; if(!id) return alert('请选择 1 项'); const n=findById(id); const name=prompt('重命名为：', n.name); if(name){ n.name=name; renderAll() } }
  qs('#cmdDel').onclick = ()=>{ const p=panes[active]; if(!p.selection.size) return; if(!confirm('确定删除所选项目（演示）？')) return; [...p.selection].forEach(id=>removeNode(id)); p.selection.clear(); renderAll() }
  qs('#cmdAlbum').onclick = ()=> alert('已加入相册（演示）')
  qs('#cmdTags').onclick = ()=> alert('标签已更新（演示）')

  // 复制与删除辅助
  function parentOf(id){ let p=null; (function rec(n){ if(!n.children) return; for(const c of n.children){ if(c.id===id){ p=n; return } rec(c) } })(root); return p }
  function removeNode(id){ const p=parentOf(id); if(p){ p.children=p.children.filter(c=>c.id!==id) } }
  function cloneNode(n){ if(n.type==='folder') return {id:uid(),type:'folder',name:n.name+' - 副本',children:(n.children||[]).map(cloneNode)}; return {...n,id:uid(),name:n.name+' - 副本'} }

  // 事件绑定：视图/布局/预览/搜索
  qs('#viewTiles').onclick=()=>{ panes[active].view='tiles'; qs('#viewTiles').classList.add('bg-white','shadow'); qs('#viewList').classList.remove('bg-white','shadow'); renderAll() }
  qs('#viewList').onclick=()=>{ panes[active].view='list'; qs('#viewList').classList.add('bg-white','shadow'); qs('#viewTiles').classList.remove('bg-white','shadow'); renderAll() }
  document.querySelectorAll('.sizeBtn').forEach(b=> b.onclick=()=>{ document.querySelectorAll('.sizeBtn').forEach(x=>x.classList.remove('bg-white','shadow')); b.classList.add('bg-white','shadow'); setTile(parseInt(b.dataset.size)); renderAll() })
  qs('#btnSingle').onclick=()=>{ layoutMode='single'; setLay('btnSingle') }
  qs('#btnH').onclick=()=>{ layoutMode='h'; setLay('btnH') }
  qs('#btnV').onclick=()=>{ layoutMode='v'; setLay('btnV') }
  function setLay(id){ ['btnSingle','btnH','btnV'].forEach(k=>qs('#'+k).classList.remove('bg-white','shadow')); qs('#'+id).classList.add('bg-white','shadow'); renderAll() }
  qs('#togglePreview').onchange=e=>{ previewOn=e.target.checked; renderAll() }
  qs('#search').oninput = e=>{ panes[active].keyword=(e.target.value||'').toLowerCase().trim(); renderAll() }

  // 导航按钮与快捷键
  qs('#navBack').onclick=()=>back(); qs('#navForward').onclick=()=>forward(); qs('#navUp').onclick=()=>up()
  document.addEventListener('keydown', e=>{ const p=panes[active]; if(e.key==='Backspace' && !e.target.matches('input,textarea')){ e.preventDefault(); up() } if(e.altKey&&e.key==='ArrowLeft'){ e.preventDefault(); back() } if(e.altKey&&e.key==='ArrowRight'){ e.preventDefault(); forward() } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){ e.preventDefault(); items(p).forEach(i=>p.selection.add(i.id)); renderAll() } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){ e.preventDefault(); qs('#cmdCopy').click() } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){ e.preventDefault(); qs('#cmdCut').click() } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){ e.preventDefault(); qs('#cmdPaste').click() } if(e.key==='Delete'){ e.preventDefault(); qs('#cmdDel').click() } if(e.key==='Enter'){ const it=selectedOne(); if(it){ if(it.type==='folder') enter(p,it); else openPreview(it) } } })

  // 主题
  function theme(m){ document.documentElement.classList.toggle('dark', m==='dark'); document.body.className = m==='dark' ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-900'; localStorage.setItem('argus-theme', m) }
  const saved = localStorage.getItem('argus-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); theme(saved)
  qs('#btnTheme').onclick=()=> theme(document.documentElement.classList.contains('dark')? 'light':'dark')

  // 启动
  setTile(220); renderAll()
  </script>
</body>
<style>
  .dark .bg-white{ background:#0f172a }
  .dark .bg-slate-50{ background:#0b1220 }
  .dark .text-slate-900{ color:#E2E8F0 }
  .dark .border-slate-200{ border-color:#253048 }
  .dark .hover\:bg-slate-100:hover{ background:#172036 }
</style>
</html>
